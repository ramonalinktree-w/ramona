<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ramona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#E64B00;
    --cream:#FAF5E1;
    --on-accent:#FAF5E1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    background:var(--cream);
    color:var(--accent);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:64px 20px 72px;
    -webkit-font-smoothing:antialiased;
  }
  .container{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .share-top{
    position:fixed;top:16px;right:16px;z-index:20;
    width:42px;height:42px;border-radius:50%;
    border:0;background:#fff;color:#111;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
    transition:transform .15s ease;
  }
  .share-top:hover{transform:scale(1.06)}
  .share-top svg{width:18px;height:18px;fill:currentColor}

  .avatar{
    width:96px;height:96px;border-radius:50%;
    object-fit:cover;background:var(--accent);
  }
  .name{
    margin-top:18px;
    font-weight:700;
    font-size:24px;
    line-height:1.25;
    text-align:center;
  }
  .bio{
    margin-top:4px;
    font-weight:500;
    font-size:17px;
    text-align:center;
  }
  .bio:empty{display:none}
  .socials{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px;
  }
  .socials:empty{display:none}
  .socials a{
    color:var(--accent);flex:none;
    width:48px;height:48px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    transition:transform .15s ease,background .15s ease;
  }
  .socials a:hover{transform:scale(1.08);background:rgba(230,75,0,.10)}
  .socials svg{width:30px;height:30px;display:block;flex:none;overflow:visible;fill:currentColor}

  .py-badge{
    display:block;margin:22px auto 0;
    width:150px;max-width:55%;height:auto;
  }
  .py-badge[hidden]{display:none}

  .links{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:30px}

  .section-title{
    margin-top:14px;
    text-align:center;
    font-weight:700;
    font-size:16px;
    color:var(--accent);
  }
  .section-title:first-child{margin-top:0}

  .link{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:58px;
    background:var(--accent);
    color:var(--on-accent);
    text-decoration:none;
    border-radius:32px;
    padding:12px 54px;
    text-align:center;
    font-weight:500;
    font-size:16px;
    line-height:1.3;
    transition:transform .14s ease,filter .14s ease;
  }
  .link:hover{transform:scale(1.015);filter:brightness(1.06)}
  .link:active{transform:scale(.99)}
  .link .label{display:block}
  .link .sub{
    display:block;margin-top:3px;
    font-weight:400;font-size:13px;line-height:1.35;
    opacity:.8;
  }
  .link .thumb{
    position:absolute;left:8px;top:50%;transform:translateY(-50%);
    width:42px;height:42px;object-fit:cover;border-radius:50%;background:#fff;
  }
  .link .kebab{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--on-accent);opacity:.75;
    transition:opacity .15s ease,background .15s ease;
  }
  .link .kebab:hover{opacity:1;background:rgba(255,255,255,.16)}
  .link .kebab svg{width:4px;height:18px;fill:currentColor}
  .link .kebab.copied::after{
    content:"Copiado";
    position:absolute;right:42px;top:50%;transform:translateY(-50%);
    background:#111;color:#fff;font-size:11px;font-weight:500;
    padding:3px 7px;border-radius:5px;white-space:nowrap;
  }

  @media (max-width:480px){
    body{padding:56px 16px 60px}
    .name{font-size:22px}
    .link{font-size:15px;padding:12px 50px}
  }

  .modal-overlay{
    position:fixed;inset:0;z-index:1000;
    background:rgba(20,10,4,.78);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;justify-content:center;
    padding:24px;
    opacity:0;transition:opacity .2s ease;
  }
  .modal-overlay.open{display:flex;opacity:1}
  .modal{
    position:relative;
    width:100%;max-width:820px;height:88vh;
    background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    display:flex;flex-direction:column;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;background:var(--accent);color:#fff;
    font-weight:700;font-size:15px;flex:none;
  }
  .modal-head .actions{display:flex;align-items:center;gap:6px}
  .modal-head a.open-tab{
    color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;
    padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.2);
  }
  .modal-close{
    border:none;background:rgba(255,255,255,.2);color:#fff;
    width:34px;height:34px;border-radius:8px;cursor:pointer;
    font-size:20px;line-height:1;
  }
  .modal-body{flex:1;min-height:0;background:#525659}
  .modal-body iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <button class="share-top" onclick="sharePage()" aria-label="Compartir">
    <svg viewBox="0 0 24 24"><path d="M12 3l4 4-1.4 1.4L13 6.8V15h-2V6.8L9.4 8.4 8 7l4-4zM5 11h3v2H7v6h10v-6h-1v-2h3v10H5V11z"></path></svg>
  </button>

  <main class="container">
    <img class="avatar" id="avatar" src="assets/avatar.jpg" alt="Ramona">
    <h1 class="name" id="name">ramona_uruguay</h1>
    <p class="bio" id="bio"></p>
    <div class="socials" id="socials"></div>
    <img class="py-badge" id="pyLogo" src="assets/pedidosya-logo.svg?v=20261023-2" alt="PedidosYa" hidden>
    <nav class="links" id="links"></nav>
  </main>

  <div class="modal-overlay" id="menuModal" onclick="if(event.target===this)closeMenu()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Documento">
      <div class="modal-head">
        <span id="modalTitle">Carta</span>
        <div class="actions">
          <a class="open-tab" id="modalOpenTab" href="#" target="_blank" rel="noopener">Abrir en pestaña ↗</a>
          <button class="modal-close" onclick="closeMenu()" aria-label="Cerrar">&times;</button>
        </div>
      </div>
      <div class="modal-body" id="menuBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js?v=20261023-2"></script>
  <script src="defaults.js?v=20261023-2"></script>
  <script src="app.js?v=20261023-2"></script>
  <script>
    var CURRENT_PDF = "";
    var PROFILE = {};
    var KEBAB_SVG = '<svg viewBox="0 0 4 18"><circle cx="2" cy="2" r="2"></circle><circle cx="2" cy="9" r="2"></circle><circle cx="2" cy="16" r="2"></circle></svg>';

    function esc(s){
      return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
      });
    }

    function render(cfg){
      PROFILE = cfg.profile || {};
      document.title = PROFILE.name || "Ramona";
      var av = PROFILE.avatar_url || "assets/avatar.jpg";
      document.getElementById("avatar").src = av;
      document.getElementById("avatar").alt = PROFILE.name || "";
      document.getElementById("name").textContent = PROFILE.name || "";
      document.getElementById("bio").textContent = PROFILE.bio || "";
      document.getElementById("pyLogo").hidden = PROFILE.show_pedidosya_logo === false;

      var soc = document.getElementById("socials");
      soc.innerHTML = "";
      (cfg.socials || []).forEach(function(s){
        if(!s || !s.url) return;
        var a = document.createElement("a");
        a.href = s.url; a.target = "_blank"; a.rel = "noopener";
        a.setAttribute("aria-label", s.type || "link");
        a.innerHTML = LT.socialSvg(s.type);
        soc.appendChild(a);
      });

      var wrap = document.getElementById("links");
      wrap.innerHTML = "";
      var group = "";
      (cfg.links || []).forEach(function(l){
        if(!l || l.enabled === false) return;

        if(l.kind === "heading"){
          group = l.label || "";
          var h = document.createElement("h2");
          h.className = "section-title";
          h.textContent = group;
          wrap.appendChild(h);
          return;
        }
        if(!l.url) return;

        l._group = group;
        var a = document.createElement("a");
        a.className = "link";
        a.href = l.url;
        if(l.kind === "pdf"){
          a.setAttribute("role", "button");
          a.addEventListener("click", function(e){ openMenu(e, l); });
        } else {
          a.target = "_blank";
          a.rel = "noopener";
        }
        a.addEventListener("click", function(){
          LT.logEvent("click", l);
          LT.pixelClick(l, PROFILE);
        });

        var html = "";
        if(l.thumb_url) html += '<img class="thumb" src="' + esc(l.thumb_url) + '" alt="">';
        html += '<span class="label">' + esc(l.label);
        if(l.sublabel) html += '<span class="sub">' + esc(l.sublabel) + '</span>';
        html += '</span>';
        html += '<span class="kebab" role="button" aria-label="Compartir" data-share="' + esc(l.url) + '">' + KEBAB_SVG + '</span>';
        a.innerHTML = html;
        wrap.appendChild(a);
      });

      wrap.querySelectorAll(".kebab").forEach(function(k){
        k.addEventListener("click", function(e){
          e.preventDefault(); e.stopPropagation();
          var url = k.getAttribute("data-share") || location.href;
          if(navigator.share){ navigator.share({ url: url }).catch(function(){}); }
          else if(navigator.clipboard){
            navigator.clipboard.writeText(url);
            k.classList.add("copied");
            setTimeout(function(){ k.classList.remove("copied"); }, 1200);
          }
        });
      });
    }

    function openMenu(e, link){
      if(e) e.preventDefault();
      if(link){
        CURRENT_PDF = link.url;
        document.getElementById("modalTitle").textContent = link.label || "Documento";
        document.getElementById("modalOpenTab").href = link.url;
      }
      var body = document.getElementById("menuBody");
      body.innerHTML = "";
      var f = document.createElement("iframe");
      f.src = CURRENT_PDF + "#toolbar=1&navpanes=0&view=FitH";
      f.title = "Documento";
      body.appendChild(f);
      document.getElementById("menuModal").classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeMenu(){
      document.getElementById("menuModal").classList.remove("open");
      document.getElementById("menuBody").innerHTML = "";
      document.body.style.overflow = "";
    }
    document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeMenu(); });

    function sharePage(){
      var data = { title: document.title, url: location.href };
      if(navigator.share){ navigator.share(data).catch(function(){}); }
      else if(navigator.clipboard){ navigator.clipboard.writeText(location.href); }
    }

    (function init(){
      render(LT.normalize(null));
      LT.loadConfig().then(function(cfg){
        render(cfg);
        // Pixel de Meta: manda el ID guardado en la base (editable desde el panel).
        // Si la base no responde (ej. proyecto pausado) se usa META_PIXEL_ID_FALLBACK de
        // config.js, si existe, para no perder la medición.
        if(cfg._fromDb) LT.initPixel(cfg.profile);
        else if(window.LT_CONFIG && window.LT_CONFIG.META_PIXEL_ID_FALLBACK) LT.initPixel({ meta_pixel_id: window.LT_CONFIG.META_PIXEL_ID_FALLBACK });
      });
      try{
        if(!sessionStorage.getItem("lt_viewed")){
          sessionStorage.setItem("lt_viewed", "1");
          LT.logEvent("view", null);
        }
      }catch(e){ LT.logEvent("view", null); }
    })();
  </script>
</body>
</html>
